<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سلة التسوق - الهيكو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <style>
        .cart-page {
            padding: 40px 0 80px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 28px;
            align-items: start;
        }

        .cart-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .cart-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-card-header h2 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--secondary);
        }

        .clear-cart-btn {
            font-size: 0.82rem;
            color: var(--error);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .clear-cart-btn:hover {
            opacity: 0.7;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid #f5f5f5;
            align-items: center;
            transition: background var(--transition);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item:hover {
            background: #fafafa;
        }

        .cart-item-img {
            width: 90px;
            height: 90px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #f5f0e8;
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-brand {
            font-size: 0.72rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .cart-item-name {
            font-family: var(--font-heading);
            font-size: 1rem;
            color: var(--secondary);
            margin-bottom: 4px;
        }

        .cart-item-name a {
            color: inherit;
        }

        .cart-item-name a:hover {
            color: var(--primary);
        }

        .cart-item-meta {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-qty-control {
            display: inline-flex;
            align-items: center;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .cart-qty-btn {
            width: 32px;
            height: 32px;
            background: var(--bg);
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-qty-btn:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .cart-qty-num {
            width: 44px;
            text-align: center;
            border: none;
            border-left: 1.5px solid var(--border);
            border-right: 1.5px solid var(--border);
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--secondary);
            background: #fff;
            padding: 0;
            height: 32px;
            outline: none;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
        }

        .remove-item-btn:hover {
            background: #fce4ec;
            color: var(--error);
        }

        .cart-item-price {
            text-align: left;
            min-width: 90px;
        }

        .item-price-total {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--secondary);
            white-space: nowrap;
        }

        .item-price-unit {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* Summary */
        .summary-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            position: sticky;
            top: 90px;
        }

        .summary-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--secondary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            font-size: 0.88rem;
        }

        .summary-row .label {
            color: var(--text-light);
        }

        .summary-row.discount .value {
            color: var(--success);
            font-weight: 600;
        }

        .summary-row.total {
            border-top: 2px solid var(--border);
            margin-top: 8px;
            padding-top: 14px;
            font-weight: 700;
        }

        .summary-row.total .value {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--secondary);
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: var(--secondary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            transition: var(--transition);
            font-family: var(--font-body);
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .trust-badges {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .trust-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .trust-badge i {
            font-size: 1.1rem;
            color: var(--primary);
        }

        @media (max-width:768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <style>
        .navbar-brand { text-decoration: none; display: inline-block; }
        .heiko-logo-wrap { position:relative; width:60px; height:60px; display:flex; align-items:center; justify-content:center; }
        .heiko-ring { position:absolute; inset:0; width:100%; height:100%; animation:heiko-spin 16s linear infinite; }
        @keyframes heiko-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .heiko-inner-logo { width:36px; height:36px; object-fit:contain; position:relative; z-index:1; border-radius:50%; }
        .heiko-inner-text { width:36px; height:36px; background:var(--primary); border-radius:50%; display:none; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:1.3rem; color:#fff; font-weight:700; position:relative; z-index:1; }
    </style><link rel="stylesheet" href="/css/mobile.css" />
<script>
/* ===== Dark/Light Mode ===== */
function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('heiko_theme', next);
}
/* Apply saved theme immediately */
(function() {
    var saved = localStorage.getItem('heiko_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar scrolled" id="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
  <div class="heiko-logo-wrap">
    <svg class="heiko-ring" viewBox="0 0 100 100">
      <defs>
        <path id="circle-path" d="M 50,50 m -32,0 a 32,32 0 1,1 64,0 a 32,32 0 1,1 -64,0"/>
      </defs>
      <text font-size="11.5" fill="var(--primary)" font-family="Georgia,serif" letter-spacing="3.5">
        <textPath href="#circle-path">HEIKO ✦ PERFUMES ✦ ORIGINAL ✦ </textPath>
      </text>
    </svg>
    <img src="/images/logo/heiko.png" alt="الهيكو" class="heiko-inner-logo"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
    <div class="heiko-inner-text" style="display:none;">H</div>
  </div>
</a>
            <div class="nav-overlay" id="navOverlay"></div>
                                                <ul class="navbar-nav" id="navbarNav">
                <li><a href="/">الرئيسية</a></li>
                <li><a href="/products.html">المنتجات</a></li>
                <li><a href="/#offers-section">العروض</a></li>
                <li><a href="#contact">تواصل معنا</a></li>
            </ul>
            <div class="navbar-actions">
                <button class="nav-icon-btn" onclick="window.location.href='cart.html'" aria-label="سلة">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <button class="nav-icon-btn" id="userBtn" aria-label="حساب"><i class="fas fa-user"></i></button>
                <button class="theme-toggle" id="themeToggle" title="تبديل الوضع" onclick="toggleTheme()">
                    <i class="fas fa-moon icon-moon"></i>
                    <i class="fas fa-sun icon-sun"></i>
                </button>
                <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <div class="page-header">
        <h1>سلة التسوق</h1>
        <div class="breadcrumb">
            <a href="/">الرئيسية</a>
            <span class="sep">/</span>
            <span>سلة التسوق</span>
        </div>
    </div>

    <div class="cart-page">
        <div class="container">

            <!-- Empty -->
            <div id="emptyCart" class="empty-state" style="display:none;">
                <i class="fas fa-shopping-bag"></i>
                <h3>سلتك فارغة!</h3>
                <p>لم تضف أي منتجات بعد</p>
                <a href="/products.html" class="btn btn-primary">ابدأ التسوق</a>
            </div>

            <!-- Layout -->
            <div class="cart-layout" id="cartLayout">

                <!-- Items -->
                <div>
                    <div class="cart-card">
                        <div class="cart-card-header">
                            <h2><i class="fas fa-shopping-bag" style="color:var(--primary);margin-left:8px;"></i>
                                المنتجات (<span id="itemCount">0</span>)</h2>
                            <button class="clear-cart-btn" onclick="clearCart()">
                                <i class="fas fa-trash"></i> مسح الكل
                            </button>
                        </div>
                        <div id="cartItemsList"></div>
                    </div>
                    <div style="margin-top:16px;">
                        <a href="/products.html" class="btn btn-outline">
                            <i class="fas fa-arrow-right"></i> مواصلة التسوق
                        </a>
                    </div>
                </div>

                <!-- Summary -->
                <div class="summary-card">
                    <h3 class="summary-title">ملخص الطلب</h3>

                    <div class="summary-row">
                        <span class="label">المجموع</span>
                        <span class="value" id="subtotal">0 ج.م</span>
                    </div>
                    <div class="summary-row discount" id="discountRow" style="display:none;">
                        <span class="label">الخصم</span>
                        <span class="value" id="discountVal">-0 ج.م</span>
                    </div>
                    <div class="summary-row total">
                        <span>الإجمالي</span>
                        <span class="value" id="totalVal">0 ج.م</span>
                    </div>

                    <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                        <i class="fas fa-check-circle"></i> إتمام الطلب
                    </button>

                    <a href="/products.html"
                        style="display:block;text-align:center;margin-top:12px;font-size:0.85rem;color:var(--text-light);">
                        مواصلة التسوق
                    </a>

                    <div class="trust-badges">
                        <div class="trust-badge"><i class="fas fa-lock"></i><span>دفع آمن</span></div>
                        <div class="trust-badge"><i class="fas fa-undo"></i><span>إرجاع مجاني</span></div>
                        <div class="trust-badge"><i class="fas fa-certificate"></i><span>أصلي 100%</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>
    <script src="/js/main.js"></script>
    <script src="/js/cart.js"></script>
</body>

</html>
